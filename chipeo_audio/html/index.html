<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chipeo System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">

  <!-- ===== BIBLIOTECA ===== -->
  <section id="library" class="panel">
    <header><span>MI BIBLIOTECA MUSICAL</span><button class="x" data-close>&times;</button></header>

    <div class="card">
      <h4>Añadir a la biblioteca</h4>
      <div class="row">
        <input id="songTitle" maxlength="40" placeholder="Título de la canción (Opcional)...">
        <button id="btnClone" class="btn">CLONAR USB</button>
      </div>
      <div class="row">
        <input id="songUrl" placeholder="Pega el enlace directo .mp3 o .wav aquí...">
        <button id="btnSave" class="btn">+ GUARDAR</button>
      </div>
    </div>

    <div class="card">
      <h4>Reproducción rápida (enlace directo)</h4>
      <div class="row">
        <input id="quickUrl" placeholder="Pega el enlace de música .mp3 o .wav aquí...">
        <button id="btnQuick" class="btn icon">&#10095;</button>
      </div>
    </div>

    <div class="card grow">
      <h4>Mi biblioteca musical</h4>
      <div id="songs"></div>
    </div>
  </section>

  <!-- ===== EQUIPO ===== -->
  <section id="unit" class="panel">
    <div class="topbar">
      <span id="volPill" class="pill">100%</span>
      <button class="x red" data-close>&times;</button>
    </div>

    <div class="temps">
      <div class="lcd green"><small>TEMP</small><b id="temp">48°C</b></div>
      <div class="lcd red"><small>VOLT</small><b id="volt">13.3</b></div>
    </div>

    <div class="head">
      <div class="brand">Pioneer <span>MVH-X480BT</span></div>
      <div class="headbody">
        <div id="knob-master" class="knob big" title="Volumen general"></div>
        <div class="screen">
          <div id="status" class="status">STOPPED</div>
          <div id="track" class="track">—</div>
          <canvas id="spectrum" width="260" height="34"></canvas>
          <div class="screenfoot"><span id="trk">TR 00</span><span id="time">00:00 / 00:00</span></div>
        </div>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <div class="transport">
        <button id="bPrev">&#9198;</button>
        <button id="bPlay">&#9654;</button>
        <button id="bPause">&#10074;&#10074;</button>
        <button id="bStop">&#9632;</button>
        <button id="bNext">&#9197;</button>
      </div>
    </div>

    <div id="amps"></div>

    <div class="foot">CHIPEO <span>SYSTEM</span></div>
  </section>
</div>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
